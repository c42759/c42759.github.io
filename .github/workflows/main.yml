name: NextJS CI

on: [push]

jobs:
  build:

    runs-on: [self-hosted, linux]

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Setup pnpm config
      - name: Setup pnpm config
        run: echo "store-dir=${{ github.workspace }}/.pnpm-store" >> .npmrc
        working-directory: .

      # Setup Node.js
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - run: pnpm install --config.approve-builds=true
      - run: pnpm run build

      # Deploy to GitHub Pages
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './build' # Path to your static files
      - uses: actions/deploy-pages@v4
